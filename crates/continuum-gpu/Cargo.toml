[package]
name = "continuum-gpu"
description = "GPU (wgpu compute) backend for Continuum."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bevy_mikktspace = "1"
bytemuck = { version = "1.25.2", features = ["derive"] }
continuum = { path = "../continuum" }
pollster = "1.0.1"
wgpu = "30.0.1"

[dev-dependencies]
# The version wgpu uses: its backends' shader translators, for
# tests/shaders.rs.
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out", "hlsl-out", "msl-out"] }
