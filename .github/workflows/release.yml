# A version tag (v*) builds the viewer as a macOS app (Apple silicon) and
# attaches it to the tag's GitHub release, creating the release from
# docs/RELEASE_NOTES.md if it does not exist yet.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS viewer (Apple silicon)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and bundle
        run: scripts/bundle_macos.sh
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
      - name: Keep the build (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: continuum-viewer-macos-arm64
          path: dist/*.zip
