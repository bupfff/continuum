# Correctness on the platforms the dev machine (Metal) does not cover: Vulkan
# on Linux through lavapipe and DX12 on Windows through WARP, both software
# adapters. No GPU here, so no timings: those come from the benchmark protocol
# (docs/DESIGN.md §7).

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The library crates; the experiments and the viewer are only checked.
  LIBRARY: -p continuum -p continuum-gpu -p continuum-gltf

jobs:
  linux-vulkan:
    name: Linux, Vulkan (lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WGPU_BACKEND: vulkan
      WGPU_ADAPTER_NAME: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Check everything (experiments, viewer)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps $LIBRARY
      - name: Kernel setup, timed per pipeline
        timeout-minutes: 15
        env:
          CONTINUUM_PIPELINE_TIMES: 1
        run: cargo run --release -p continuum-gpu --example kernel_setup
      - name: Tests
        run: cargo test --release $LIBRARY -- --nocapture

  windows-dx12:
    name: Windows, DX12 (WARP)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      WGPU_BACKEND: dx12
      WGPU_ADAPTER_NAME: Microsoft Basic Render Driver
      WGPU_DX12_COMPILER: dxc
    steps:
      - uses: actions/checkout@v4
      - name: Install DXC (wgpu's DX12 shader compiler for shader model 6)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo microsoft/DirectXShaderCompiler --pattern 'dxc_*.zip' --dir dxc
          # 7-Zip: the archive's backslash paths make unzip exit with an error.
          7z x -y -odxc dxc/*.zip > /dev/null
          ls dxc/bin/x64/dxcompiler.dll dxc/bin/x64/dxil.dll
          echo "$(cygpath -w "$PWD/dxc/bin/x64")" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # On WARP each large pipeline took about 30 s to build, and building
      # the kernel ran out of memory at its fifth (2026-11-07). This step
      # times DXC alone on each entry point's HLSL, to tell the compiler's
      # share from WARP's.
      - name: Tests on the CPU (shader translation), and the HLSL
        shell: bash
        env:
          CONTINUUM_DUMP_HLSL: hlsl
        run: cargo test --release -p continuum -p continuum-gpu -- --nocapture
      - name: DXC alone, timed per entry point
        timeout-minutes: 20
        continue-on-error: true
        shell: bash
        run: |
          for e in main render rebake vc_bake vc_shade render_cones; do
            echo "== $e"
            time dxc.exe -T cs_6_0 -E "$e" -HV 2021 "crates/continuum-gpu/hlsl/$e.hlsl" -Fo dxc_out.bin > /dev/null
          done
      - name: Kernel setup on WARP, timed per pipeline
        timeout-minutes: 20
        continue-on-error: true
        shell: bash
        env:
          CONTINUUM_PIPELINE_TIMES: 1
        run: cargo run --release -p continuum-gpu --example kernel_setup
