# Correctness on the platforms the dev machine (Metal) does not cover: Vulkan
# on Linux through lavapipe (a software adapter; every test, the GPU's
# included), and on Windows the DX12 shaders through DXC (WARP, the software
# adapter, cannot build the kernel: see the Windows job). No GPU here, so no timings: those come from the benchmark protocol
# (docs/DESIGN.md §7).

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The library crates; the experiments and the viewer are only checked.
  LIBRARY: -p continuum -p continuum-gpu -p continuum-gltf

jobs:
  linux-vulkan:
    name: Linux, Vulkan (lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WGPU_BACKEND: vulkan
      WGPU_ADAPTER_NAME: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Check everything (experiments, viewer)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps $LIBRARY
      - name: Kernel setup, timed per pipeline
        timeout-minutes: 15
        env:
          CONTINUUM_PIPELINE_TIMES: 1
        run: cargo run --release -p continuum-gpu --example kernel_setup
      - name: Tests
        run: cargo test --release $LIBRARY -- --nocapture

  windows-dx12:
    name: Windows, DX12 shaders (DXC)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install DXC (wgpu's DX12 shader compiler for shader model 6)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo microsoft/DirectXShaderCompiler --pattern 'dxc_*.zip' --dir dxc
          # 7-Zip: the archive's backslash paths make unzip exit with an error.
          7z x -y -odxc dxc/*.zip > /dev/null
          ls dxc/bin/x64/dxcompiler.dll dxc/bin/x64/dxil.dll
          echo "$(cygpath -w "$PWD/dxc/bin/x64")" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The kernel's GPU tests cannot run on WARP: each large pipeline takes
      # 33-41 s to build there and the kernel runs out of memory at its fifth,
      # while DXC alone compiles each entry point in 0.7-5.2 s (CI run 5,
      # 2026-11-07). So Windows checks the shaders compile for DX12: naga's
      # HLSL for every entry point, through DXC as wgpu calls it (HLSL 2018).
      - name: Tests on the CPU (shader translation), and the HLSL
        shell: bash
        env:
          CONTINUUM_DUMP_HLSL: hlsl
        run: cargo test --release -p continuum -p continuum-gpu -- --nocapture
      - name: DXC compiles every entry point
        shell: bash
        run: |
          failed=0
          for f in crates/continuum-gpu/hlsl/*.hlsl; do
            e=$(basename "$f" .hlsl)
            start=$(date +%s%N)
            if dxc.exe -T cs_6_0 -E "$e" -HV 2018 "$f" -Fo dxc_out.bin > dxc_log.txt 2>&1; then
              echo "$e: $(( ($(date +%s%N) - start) / 1000000 )) ms"
            else
              echo "$e: FAILED"; grep -i error dxc_log.txt | head -5; failed=1
            fi
          done
          exit $failed
