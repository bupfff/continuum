[workspace]
resolver = "3"
members = ["apps/viewer", "crates/bevy_continuum", "crates/continuum", "crates/continuum-gltf", "crates/continuum-gpu", "experiments/flatland", "experiments/room3d"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[profile.release]
debug = 1 # keep symbols so profilers can attribute time

# wgpu-core with one fix for TLASes with many instances: see third_party/README.md.
[patch.crates-io]
wgpu-core = { path = "third_party/wgpu-core" }
wgpu-hal = { path = "third_party/wgpu-hal" }
